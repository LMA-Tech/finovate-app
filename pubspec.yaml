name: finovate_app
description: "Finovate - Investimento Sem Ruído"
publish_to: 'none'
version: 1.1.0+2 # 1.1.0 = version name (what users see), +2 = build number (internal tracking)

environment:
  sdk: ^3.5.4

#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  firebase_core: ^3.13.1

  # Utility Packages
  flutter_svg: ^2.0.7
  lottie: ^3.1.3
  shared_preferences: ^2.0.15
  get: ^4.6.6
  intl: ^0.20.2
  url_launcher: ^6.3.1
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  reactive_forms: ^18.1.1
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.2.0+3
  iconsax: ^0.0.8
  loading_indicator: ^3.1.1
  mask_text_input_formatter: ^2.9.0
  pinput: ^5.0.1
  local_auth: ^2.3.0
  flutter_launcher_icons: ^0.14.4
  auto_size_text: ^3.0.0

  # State Management
  flutter_chat_ui: ^2.9.0
  flutter_chat_core: ^2.8.0
  flutter_cache_manager: ^3.3.1


  # Product Specific


  #--------------- ./ PACKAGES END ------------------#
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 23
  # For Android adaptive icons
  adaptive_icon_background: "#071735"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  # Remove default Flutter icon
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - .env
    - assets/images/onboarding/
    - assets/images/signup/
    - assets/logos/
    - assets/icons/
    - assets/icons/bottom_nav/
    - assets/backgrounds/
    - assets/finovate/logotipo/svg/
    - assets/finovate/simbolo/svg/

  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans/DMSans-Italic.ttf
          style: italic
        - asset: assets/fonts/DMSans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans/DMSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/DMSans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans/DMSans-Bold.ttf
          weight: 800