# Firebase App Distribution CI/CD Pipeline
# This workflow builds the Flutter app and distributes it to testers via Firebase
#
# Branch Strategy:
#   - test: Builds and distributes to Firebase App Distribution (for testers)
#   - main: Production builds for App Store (no Firebase distribution)
#   - dev: Local development only (no CI/CD)
#
# Required GitHub Secrets (set in repo Settings > Secrets and variables > Actions):
#   FIREBASE_ANDROID_APP_ID    - Firebase App ID for Android (from Firebase Console)
#   FIREBASE_IOS_APP_ID        - Firebase App ID for iOS (from Firebase Console)
#   FIREBASE_SERVICE_ACCOUNT   - Firebase service account JSON
#   ANDROID_KEYSTORE_BASE64    - Base64 encoded keystore file
#   ANDROID_KEY_PROPERTIES     - Contents of key.properties file
#   GOOGLE_SERVICES_JSON       - Contents of google-services.json
#   GOOGLE_SERVICE_INFO_PLIST  - Contents of GoogleService-Info.plist
#   ENV_FILE                   - Contents of .env file

name: Build & Distribute to Firebase

on:
  # Trigger on push to test branch only (for Firebase distribution)
  push:
    branches:
      - test

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New build from CI/CD pipeline'

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.1'
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # ANDROID BUILD
  # ============================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Only run if platform is 'android' or 'both', or if triggered by push
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android builds)
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 3. Set up Flutter
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 4. Create .env file from secret
      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # 5. Create google-services.json from secret
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # 6. Set up Android signing
      - name: Set up Android signing
        run: |
          # Create key.properties in android/ folder
          echo '${{ secrets.ANDROID_KEY_PROPERTIES }}' > android/key.properties

          # Decode and create keystore file in android/app/ folder (where storeFile points)
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > android/app/upload-keystore.jks

      # 7. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 8. Build release APK
      - name: Build APK
        run: flutter build apk --release

      # 9. Upload APK as artifact (for debugging/manual download)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # 10. Distribute to Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: admins
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ${{ github.event.inputs.release_notes || 'Automated build' }}

  # ============================================
  # iOS BUILD
  # ============================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    # Only run if platform is 'ios' or 'both', or if triggered by push
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 3. Create .env file from secret
      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # 4. Create GoogleService-Info.plist from secret
      - name: Create GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > ios/Runner/GoogleService-Info.plist

      # 5. Install Apple certificate and provisioning profile
      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temp keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Install provisioning profile
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 6. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Install CocoaPods dependencies
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # 8. Build iOS app with signing
      - name: Build iOS
        run: |
          flutter build ios --release

      # 9. Create signed IPA
      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/app-release.ipa Payload
          rm -rf Payload

      # 10. Upload IPA as artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/app-release.ipa
          retention-days: 7

      # 11. Distribute to Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: admins
          file: build/ios/ipa/app-release.ipa
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ${{ github.event.inputs.release_notes || 'Automated build' }}

  # ============================================
  # NOTIFY ON COMPLETION
  # ============================================
  notify:
    name: Notify completion
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Android build: ${{ needs.build-android.result }}"
          echo "iOS build: ${{ needs.build-ios.result }}"

          if [ "${{ needs.build-android.result }}" == "failure" ] || [ "${{ needs.build-ios.result }}" == "failure" ]; then
            echo "::error::One or more builds failed!"
            exit 1
          fi

          echo "All builds completed successfully!"
